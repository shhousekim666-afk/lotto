name: Update Lotto Data

on:
  workflow_dispatch:  # namu.wiki 차단 해제 시 수동 시도용. 자동 schedule 비활성.

permissions:
  contents: write
  actions: write

concurrency:
  group: lotto-data-write
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python update_lotto.py

      - uses: ./.github/actions/check-site

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "data: 로또 데이터 자동 갱신"
            git push
          else
            echo "변경 없음"
          fi

      - name: Recalculate backtest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run backtest-rerun.yml --ref main -R "$GITHUB_REPOSITORY"
